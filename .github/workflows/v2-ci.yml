name: v2-ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ETORO_TEST_POSTGRES_DSN: >-
        host=127.0.0.1 port=5432 dbname=postgres user=postgres password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and verification tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[live,dev]'
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run complete unittest suite
        run: PYTHONWARNINGS=error python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript
        run: node --check src/etoro_agent/dashboard_static/dashboard.js
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Bandit security scan
        run: bandit -q -r src/etoro_agent -x tests
      - name: Dependency audit
        run: pip-audit
      - name: Dependency consistency
        run: python -m pip check
      - name: Runtime lock consistency
        run: |
          python -m venv /tmp/etoro-v2-lock-check
          /tmp/etoro-v2-lock-check/bin/pip install --disable-pip-version-check -r requirements.lock
          /tmp/etoro-v2-lock-check/bin/pip install --disable-pip-version-check --no-build-isolation --no-deps .
          /tmp/etoro-v2-lock-check/bin/pip check
      - name: Repository secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|x-user-key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,}|x-api-key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,})' -- ':!*.md'; then
            echo 'credential-like material detected'
            exit 1
          fi

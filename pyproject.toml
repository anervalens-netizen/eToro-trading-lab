[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "etoro-demo-agent"
version = "0.6.12"
description = "Fail-closed autonomous eToro DEMO research and execution kernel"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=50,<51",
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=25,<27",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
live = ["websockets>=15,<16"]
release = [
  "pip>=26.1.2,<27",
  "setuptools>=83,<84",
]
dev = [
  "bandit>=1.8,<2",
  "build>=1.5,<2",
  "coverage[toml]>=7.15,<8",
  "cyclonedx-bom>=7.3,<8",
  "mypy>=2.3,<3",
  "pip>=26.1.2,<27",
  "pip-audit>=2.9,<3",
  "ruff>=0.12,<1",
  "setuptools>=83,<84",
]

[project.scripts]
etoro-v2 = "etoro_agent.v2_runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etoro_agent = ["dashboard_static/*", "*.schema.json"]

[tool.setuptools.data-files]
"share/etoro-demo-agent" = ["ops/postgres/schema_v2.sql", "ops/postgres/schema_v2_ai.sql", "ops/postgres/schema_v3.sql", "ops/postgres/schema_v4.sql", "ops/postgres/schema_v5.sql", "ops/postgres/schema_v6.sql", "ops/postgres/schema_v7.sql", "ops/postgres/schema_v8.sql", "ops/postgres/schema_v9.sql", "ops/postgres/schema_v10.sql", "ops/postgres/schema_v11.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["etoro_agent"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

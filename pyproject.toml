[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "etoro-demo-agent"
version = "0.4.0"
description = "Fail-closed autonomous eToro DEMO research and execution kernel"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=25,<27",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
live = ["websockets>=15,<16"]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.12,<1",
  "setuptools>=83,<84",
]

[project.scripts]
etoro-v2 = "etoro_agent.v2_runtime:main"
etoro-agent = "etoro_agent.cli:main"
etoro-sol-runner = "etoro_agent.sol_runner:main"
etoro-minimax-runner = "etoro_agent.minimax_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etoro_agent = ["dashboard_static/*", "sol_decision.schema.json", "strategy_proposal.schema.json"]

[tool.setuptools.data-files]
"share/etoro-demo-agent" = ["ops/postgres/schema_v2.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

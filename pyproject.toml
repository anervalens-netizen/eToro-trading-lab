[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etoro-demo-agent"
version = "0.3.0"
description = "Fail-closed autonomous paper and eToro DEMO trading agent"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<47",
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=25,<27",
  "uvicorn>=0.35,<1",
]

[project.scripts]
etoro-agent = "etoro_agent.cli:main"
etoro-sol-runner = "etoro_agent.sol_runner:main"
etoro-minimax-runner = "etoro_agent.minimax_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etoro_agent = ["dashboard_static/*", "sol_decision.schema.json", "strategy_proposal.schema.json"]
